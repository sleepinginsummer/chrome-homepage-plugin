name: Release extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --run

      - name: Build extension ZIP
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run package

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          "dist/chrome-home-plugin-${{ github.ref_name }}.zip#Chrome Home Plugin ${{ github.ref_name }}"
          --verify-tag
          --generate-notes
          --title "Chrome Home Plugin ${{ github.ref_name }}"

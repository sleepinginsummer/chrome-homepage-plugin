<!doctype html>
<html lang="zh-CN" data-theme="cyber-dark">
	  <head>
	    <meta charset="UTF-8" />
	    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
	    <title>同步设置</title>
	    <link rel="icon" href="icon.svg" type="image/svg+xml" />
	    <script src="theme-bootstrap.js"></script>
	    <link rel="stylesheet" href="theme-tokens.css" />
	    <link rel="stylesheet" href="options.css" />
	  </head>
  <body>
    <main class="page">
      <header class="header">
        <h1>配置同步</h1>
        <p class="sub" data-i18n="sync_sub">把配置存到 GitHub / Gitee 代码片段、WebDAV 或 Chrome 账号同步，并保留历史版本可回滚。</p>
      </header>

      <section class="card appearance-card" aria-labelledby="appearanceTitle">
        <h2 id="appearanceTitle">外观</h2>
        <fieldset class="theme-picker">
          <legend>主题</legend>
          <div class="theme-options">
            <label class="theme-option" data-theme-option="cyber-dark">
              <input type="radio" name="theme" value="cyber-dark" />
              <span class="theme-preview theme-preview-cyber" aria-hidden="true"><span></span><span></span><span></span></span>
              <strong>赛博深色</strong>
            </label>
            <label class="theme-option" data-theme-option="neo-brutalism">
              <input type="radio" name="theme" value="neo-brutalism" />
              <span class="theme-preview theme-preview-brutal" aria-hidden="true"><span></span><span></span><span></span></span>
              <strong>新粗野 / <span lang="en">Neo-Brutalism</span></strong>
            </label>
          </div>
        </fieldset>
        <p id="themeStatus" class="status" role="status" aria-live="polite"></p>
      </section>

      <section class="card">
        <div class="grid">
          <label class="field field-full">
            <span class="label" data-i18n="sync_provider">服务商</span>
            <select id="syncProvider" class="input">
              <option value="github_gist" data-i18n="sync_provider_github">GitHub 代码片段</option>
              <option value="gitee_gist" data-i18n="sync_provider_gitee">Gitee 代码片段</option>
              <option value="webdav" data-i18n="sync_provider_webdav">WebDAV（坚果云 / Nextcloud）</option>
              <option value="storage_sync" data-i18n="sync_provider_storage">Chrome 账号同步</option>
            </select>
          </label>

          <label class="field field-full" data-sync-field="gitUrl">
            <span class="label" data-i18n="sync_giturl">代码片段地址</span>
            <input id="syncGitUrl" class="input" data-i18n-placeholder="sync_giturl_ph" />
          </label>

          <label class="field field-full" data-sync-field="webdavUrl">
            <span class="label" data-i18n="sync_webdav_url">WebDAV 目录地址</span>
            <input id="syncWebdavUrl" class="input" data-i18n-placeholder="sync_webdav_url_ph" />
          </label>

          <label class="field" data-sync-field="username">
            <span class="label" data-i18n="sync_username">用户名</span>
            <input id="syncUsername" class="input" autocomplete="off" />
          </label>

          <label class="field" data-sync-field="token">
            <span class="label" data-i18n="sync_token">Token / 密码</span>
            <input id="syncToken" class="input" type="password" autocomplete="off" data-i18n-placeholder="sync_token_ph" />
          </label>

          <div class="field field-full">
            <span class="label" data-i18n="sync_sections">同步内容</span>
            <div class="toggle-grid">
              <label class="toggle-row"><input id="syncSectionCards" type="checkbox" /><span class="hint" data-i18n="sync_section_cards">网址卡片</span></label>
              <label class="toggle-row"><input id="syncSectionEngines" type="checkbox" /><span class="hint" data-i18n="sync_section_engines">搜索引擎</span></label>
              <label class="toggle-row"><input id="syncSectionUi" type="checkbox" /><span class="hint" data-i18n="sync_section_ui">主题与语言</span></label>
              <label class="toggle-row"><input id="syncSectionHistory" type="checkbox" /><span class="hint" data-i18n="sync_section_history">搜索历史</span></label>
            </div>
          </div>

          <div class="field field-full" data-sync-field="autoPush">
            <span class="label" data-i18n="sync_autopush">自动同步</span>
            <label class="toggle-row">
              <input id="syncAutoPush" type="checkbox" />
              <span class="hint" data-i18n="sync_autopush_desc">配置变更后自动推送到远端</span>
            </label>
          </div>
        </div>

        <div class="actions">
          <button id="saveBtn" class="btn primary" type="button" data-i18n="common_save">保存</button>
          <button id="pushBtn" class="btn" type="button" data-i18n="sync_push">推送到远端</button>
          <button id="pullBtn" class="btn" type="button" data-i18n="sync_pull">从远端拉取</button>
          <button id="testBtn" class="btn" type="button" data-i18n="sync_test">测试连接</button>
          <button id="clearRemoteHistoryBtn" class="btn" type="button" data-i18n="sync_clear_remote_history">清除远端搜索历史</button>
        </div>

        <p id="status" class="status" role="status"></p>

        <div class="backup" data-sync-field="backup">
          <div class="backup-head">
            <h2 data-i18n="sync_snapshots">备份版本</h2>
            <button id="refreshBackupsBtn" class="btn" type="button" data-i18n="sync_snapshots_refresh">刷新</button>
          </div>
          <ul id="syncSnapshotList" class="snapshot-list"></ul>
        </div>
      </section>

      <section class="card">
        <h2>本地导入/导出</h2>
        <div class="actions">
          <button id="exportBtn" class="btn" type="button">导出 JSON</button>
          <label class="btn file">
            <input id="importFile" type="file" accept="application/json" />
            导入 JSON
          </label>
        </div>
        <p class="hint">导入会覆盖当前配置（等同于从远端拉取后的写入）。</p>
      </section>
    </main>

    <script src="options.js" type="module"></script>
  </body>
</html>
